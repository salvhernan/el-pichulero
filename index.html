 text:"Tu hermano chico tiene 12 años y quiere ser futbolista como tú. Juega en la multicancha todos los días y te pregunta si lo podís llevar a probarse al club.",
 flavor:"Tiene tu misma zurda. O eso dice él.",
 options:[
 {label:"Llevarlo a probarse al club",d:{responsabilidad:3,hinchada:2},risk:"50/50",fx:s=>{if(ch(.5)){hito("Su hermano chico quedó en las inferiores");return "Quedó en las inferiores. Lo viste en su primer partido y gritaste más fuerte que en tus propios goles.";}
   return "No quedó, pero el técnico le dijo que volviera el próximo año. Le compraste un helado y le dijiste que a ti también te pasó.";}},
 {label:"Pagarle una escuela de fútbol buena",money:-.8,d:{responsabilidad:3},res:"Lo metiste a una escuela con canchas de pasto sintético. Te manda videos de sus goles todas las semanas."},
 {label:"Decirle que primero termine el colegio",d:{responsabilidad:4,hinchada:-1},res:"Se enojó contigo una semana. Tu vieja te dio las gracias en voz baja."}]},

{id:"casasola",minAge:18,maxAge:23,weight:1.2,dom:"carrete",title:"Tus viejos se van a la playa",
 text:"Tus viejos se van el fin de semana largo a El Quisco y te dejan la casa sola. En el grupo de los cabros ya están armando la lista de invitados.",
 flavor:"Tu vieja te dejó una nota: «no quiero ver ni una mancha».",
 options:[
 {label:"Carrete en la casa, con todo",d:{carrete:10,hinchada:2,forma:-4},risk:"los vecinos",fx:s=>{if(ch(.4)){s.responsabilidad-=3;return {t:"Llegaron los carabineros por los ruidos y un vecino le contó todo a tu vieja. Castigado a los 20 años.",bad:true};}
   return "Carrete épico y casa impecable al domingo en la tarde. Tu vieja encontró un vaso debajo del sillón y no dijo nada.";}},
 {label:"Invitar solo a los amigos de siempre",d:{carrete:4,liderazgo:2},res:"Asado, consola y conversación hasta tarde con los de siempre. Nadie rompió nada."},
 {label:"Aprovechar de dormir y entrenar",d:{disciplina:3,forma:4},res:"Dormiste doce horas, entrenaste y viste series. Tus amigos te borraron del grupo por un día."}]}
);

{id:"paro",minAge:20,maxAge:35,weight:1.1,dom:"camarin",title:"El sindicato llama a paro",

 flavor:"En tu club pagan al día, pero hay compañeros de otros clubes que no llegan a fin de mes.",
 options:[
 {label:"Sumarte al paro y hablar en la conferencia",d:{liderazgo:5,responsabilidad:3,prestigio:2},res:"Hablaste por los que no tienen voz. Se pagaron los sueldos atrasados y la fecha se jugó una semana después."},
 {label:"Apoyar desde atrás, sin exponerte",d:{liderazgo:1},res:"Firmaste la carta y te quedaste callado. Cumpliste, sin arriesgar nada."},
 {label:"Entrenar igual y decir que no te metís en eso",d:{liderazgo:-4,hinchada:-2},res:"Te quedaste fuera del paro. Algunos compañeros de otros clubes dejaron de saludarte."}]},

{id:"temblor",weight:1.1,dom:"barrio",when:"3 de la mañana, en la concentración",title:"¡Temblor!",
 text:"Un temblor fuerte te despierta a las 3 de la mañana en la concentración: grado 6,8 según las noticias. Nadie herido, pero la mitad del plantel está en el pasillo en calzoncillos.",
 flavor:"El utilero sigue durmiendo. Chileno de verdad.",
 options:[
 {label:"Calmar a los compañeros extranjeros",d:{liderazgo:5,responsabilidad:2},res:"Les explicaste que en Chile esto es normal y les enseñaste dónde ponerse. El refuerzo colombiano te abrazó llorando."},
 {label:"Salir corriendo a la calle con la almohada",d:{hinchada:2},fx:s=>{s.seguidores+=4000;return "Alguien te grabó corriendo con la almohada y en calzoncillos. Tenís más seguidores y menos dignidad.";}},
 {label:"Seguir durmiendo",d:{disciplina:1,forma:2},res:"Te diste vuelta y seguiste durmiendo. Al otro día eras el único descansado del plantel."}]},

{id:"beneficio",minAge:18,weight:1,dom:"barrio",title:"Partido a beneficio",
 text:"Los incendios forestales dejaron a cientos de familias sin casa en el sur, y varios jugadores organizan un partido a beneficio. Te piden que te sumes y que muevas tus redes.",
 flavor:"Hay voluntarios que llevan tres días sin dormir.",
 options:[
 {label:"Jugar el partido y donar tu premio",d:{hinchada:8,responsabilidad:4},money:-1,res:"Jugaste, donaste y te quedaste ayudando a cargar camiones con víveres. Nadie lo supo hasta que un voluntario subió una foto."},
 {label:"Ir como voluntario a la zona afectada",d:{hinchada:6,responsabilidad:6,forma:-2},res:"Pasaste dos días ayudando a limpiar escombros. Volviste cansado y con otra mirada de las cosas."},
 {label:"Subir una historia apoyando",d:{hinchada:1},fx:s=>{s.seguidores+=1000;return "Compartiste la campaña. Ayudó a difundir, aunque algunos te pidieron que hicieras algo más.";}}]},

{id:"refuerzo",minAge:20,maxAge:31,weight:1.3,dom:"camarin",title:"Llegó un refuerzo pa' tu puesto",

 {label:"Hacerte amigo y aprenderle",d:{liderazgo:2,regate:1,pase:1},res:"Resultó buena persona. Te enseñó dos trucos y te invitó a un asado con choripán argentino."},
 {label:"Pedir salir del club",d:{prestigio:-1},fx:s=>{s.flags.quiere_salir=true;return "Le dijiste a tu representante que te buscara club. La prensa ya lo sabe.";}}]},

{id:"tecniconuevo",minAge:18,maxAge:34,weight:1.2,dom:"camarin",title:"Técnico nuevo",
 text:"Echaron al técnico y llegó uno nuevo con un sistema que nadie entiende: presión alta, charlas de tres horas y videos de los partidos a las 8 de la mañana.",

 {label:"Adaptarte y estudiar los videos",d:{disciplina:4,pase:1,forma:3},res:"Fuiste el primero en entender el sistema. El técnico te puso de ejemplo en la charla."},
 {label:"Pedir una conversación mano a mano",d:{liderazgo:3,responsabilidad:2},res:"Le explicaste cómo te gusta jugar. Te escuchó y ajustó tu rol en la cancha."},
 {label:"Criticarlo en el camarín",d:{agresividad:3,liderazgo:1},risk:"te puede costar",fx:s=>ch(.5)?(s.forma-=8,{t:"Alguien le contó. Te mandó a la banca tres fechas.",bad:true}):"Nadie le contó, y al mes lo echaron igual. Tenías razón, pero no ganaste nada."}]},

const V=x=>typeof x==='function'?x(S):x;
const app=()=>document.getElementById('app');
let cleanups=[];
function onCleanup(f){cleanups.push(f);}
function render(n){
  const old=cleanups;cleanups=[];
  old.forEach(f=>{try{f();}catch(e){}});
  const a=app();a.innerHTML='';a.appendChild(n);
  try{window.scrollTo(0,0);}catch(e){}
  if(typeof n.__mount==='function'){const f=n.__mount;n.__mount=null;f();}
}
function screen(html,withHud){

  c.innerHTML=`<div class="flagbar" aria-hidden="true"><i></i><i></i><i></i></div>`+(withHud?topbarHTML()+hudHTML():'')+html;

function once(c){ /* evita doble toque en botones de decisión */
  return fn=>function(...a){if(c.__done)return;c.__done=true;return fn.apply(this,a);};
}

const SHIELD="M2 2 H48 V30 C48 45 38 54 25 58 C12 54 2 45 2 30 Z";
function insignia(club,size){
  size=size||40;
  const [c1,c2]=clubColors(club),code=clubCode(club),h=hashOf(club),id='sh'+(h%99991);
  let p=`<rect width="50" height="60" fill="${c1}"/>`;
  switch(h%7){
    case 0:p+=`<rect x="25" width="25" height="60" fill="${c2}"/>`;break;                                       // partido
    case 1:p+=`<rect y="8" width="50" height="9" fill="${c2}"/><rect y="43" width="50" height="9" fill="${c2}"/>`;break; // fajas
    case 2:p+=[4,16,28,40].map(x=>`<rect x="${x}" width="6" height="60" fill="${c2}"/>`).join('');break;       // rayas
    case 3:p+=`<path d="M-6 10 L10 -6 L58 46 L42 62 Z" fill="${c2}"/>`;break;                                 // banda
    case 4:p+=`<path d="M0 50 L25 28 L50 50 L50 62 L25 40 L0 62 Z" fill="${c2}"/><path d="M0 16 L25 2 L50 16 L50 22 L25 8 L0 22 Z" fill="${c2}"/>`;break; // cabrio
    case 5:p+=`<rect width="25" height="30" fill="${c2}"/><rect x="25" y="30" width="25" height="30" fill="${c2}"/>`;break; // cuartelado
    default:p=`<rect width="50" height="60" fill="${c2}"/><path d="M8 8 H42 V30 C42 41 35 48 25 52 C15 48 8 41 8 30 Z" fill="${c1}"/>`; // bordura
  }
  const fs=code.length>3?10.5:12.5;
  return `<svg class="ins" width="${size}" height="${Math.round(size*1.2)}" viewBox="0 0 50 60" aria-hidden="true">
<defs><clipPath id="${id}"><path d="${SHIELD}"/></clipPath></defs>
<g clip-path="url(#${id})">${p}<rect y="22.5" width="50" height="15" fill="rgba(0,0,0,.58)"/></g>
<path d="${SHIELD}" fill="none" stroke="rgba(0,0,0,.4)" stroke-width="2.6"/>
<path d="M5 5 H45 V30 C45 43 37 51 25 55 C13 51 5 43 5 30 Z" fill="none" stroke="rgba(255,255,255,.6)" stroke-width="1"/>
<text x="25" y="34.4" text-anchor="middle" font-family="Big Shoulders Display, Arial Narrow, Impact, sans-serif" font-weight="900" font-size="${fs}" fill="#fff" letter-spacing=".4">${code}</text></svg>`;

/* =================== CHIPS =================== */
function optMoney(o){let m=0;if(o.money)m+=V(o.money);if(o.rel)m+=rel(o.rel);return m;}
const picPorCarrete=dc=>Math.max(1,Math.round(dc*.25));
function chipsFor(o){
  const out=[];
  if(o.d){for(const k in o.d){const v=o.d[k];
    out.push(`<span class="chip ${k==='carrete'?'car':(v>0?'pos':'neg')}">${v>0?'+':'−'}${Math.abs(v)} ${attrLabel(k)}</span>`);}
    if(o.d.carrete>0&&!('picardia' in o.d))out.push(`<span class="chip pos">+${picPorCarrete(o.d.carrete)} PIC</span>`);}
  const m=optMoney(o);if(m)out.push(`<span class="chip money">${m>0?'+':'−'}${pesos(m)}</span>`);
  if(o.risk)out.push(`<span class="chip risk">🎲 ${o.risk}</span>`);
  return out.length?`<span class="chips">${out.join('')}</span>`:'';
}
const SNAP=['ritmo','resistencia','regate','pase','def','agresividad','responsabilidad','liderazgo','disciplina','picardia',
  'prestigio','hinchada','forma','carrete','plata','goles','asistencias','titulos','seguidores'];
function snap(){const o={};SNAP.forEach(k=>o[k]=S[k]);o.quimica=S.amor.quimica;o.pareja=S.amor.pareja?S.amor.pareja.n:null;o.estado=S.amor.estado;o.les=S.lesionado;return o;}
function diffHTML(b){
  const out=[];
  SNAP.forEach(k=>{
    const d=S[k]-b[k];
    if(k==='plata'){if(Math.abs(d)>=0.0005)out.push(`<span class="chip money">${d>0?'+':'−'}${pesos(d)}</span>`);return;}
    const r=Math.round(d);if(!r)return;
    if(k==='seguidores')return out.push(`<span class="chip seg">${r>0?'+':'−'}${miles(Math.abs(r))} seguidores</span>`);
    if(k==='goles')return out.push(`<span class="chip pos">+${r} ${r===1?'gol':'goles'}</span>`);
    if(k==='asistencias')return out.push(`<span class="chip pos">+${r} ${r===1?'asistencia':'asistencias'}</span>`);
    if(k==='titulos')return out.push(`<span class="chip pos">+${r} ${r===1?'título':'títulos'}</span>`);
    out.push(`<span class="chip ${k==='carrete'?'car':(r>0?'pos':'neg')}">${r>0?'+':'−'}${Math.abs(r)} ${attrLabel(k)}</span>`);
  });
  const pn=S.amor.pareja?S.amor.pareja.n:null;
  if(pn&&pn===b.pareja){const q=Math.round(S.amor.quimica-b.quimica);if(q)out.push(`<span class="chip amor">${q>0?'+':'−'}${Math.abs(q)} Química</span>`);
    const EST={conviviendo:'🏠 Viviendo juntos',comprometido:'💍 Comprometidos',casado:'💒 Casados'};
    if(S.amor.estado!==b.estado&&EST[S.amor.estado])out.push(`<span class="chip amor">${EST[S.amor.estado]}</span>`);}
  else if(pn&&pn!==b.pareja)out.push(`<span class="chip amor">💞 Pololeando con ${esc(pn)}</span>`);
  else if(!pn&&b.pareja)out.push(`<span class="chip neg">💔 Soltero otra vez</span>`);
  return out.length?`<div class="diff"><div class="lbl">Lo que cambió</div><div class="chips">${out.join('')}</div></div>`:'';
}
function clampAll(){
  ['ritmo','resistencia','regate','pase','def','agresividad','responsabilidad','liderazgo','disciplina','picardia'].forEach(k=>S[k]=clamp(Math.round(S[k]),1,99));
  ['prestigio','hinchada','forma','carrete'].forEach(k=>S[k]=clamp(Math.round(S[k]),0,100));
  S.plata=Math.max(0,Math.round(S.plata*1000)/1000);
  S.seguidores=Math.max(0,Math.round(S.seguidores));
  S.amor.quimica=clamp(Math.round(S.amor.quimica),0,100);
  S.lesionado=clamp(S.lesionado|0,0,3);
  if(S.items&&S.items.nutri)S.forma=Math.max(45,S.forma);          // la nutricionista no te deja caer
  S.carreteMax=Math.max(S.carreteMax,S.carrete);
}
/* el carrete baja la forma pero te hace más pillo: cada punto de carrete trae picardía */
function carretePicardia(b){
  const dc=S.carrete-b.carrete,dp=S.picardia-b.picardia;
  if(dc>0){const w=picPorCarrete(dc);if(dp<w)S.picardia=b.picardia+w;}
}

/* =================== FLUJO DE LA TEMPORADA =================== */
const SLOTS=['verano','temporada','invierno','fin'];
function startSeason(){
  S.golIni=S.goles;S.asiIni=S.asistencias;     // pa' contar TODOS los goles del año, también los de minijuegos y copas
  S.queue=['verano'];
  if(S.flags.supercopa===S.year)S.queue.push('supercopa');
  S.queue.push('temporada');
  if(natTournament())S.queue.push('seleccion');
  S.queue.push('invierno');
  if(S.age>=18&&ch(S.amor.pareja?.85:.55))S.queue.push('amor');   // la vida amorosa tiene su propio paso
  S.queue.push('fin');
  if(isChile(S.league))S.queue.push('copachile');
  if(S.contComp)S.queue.push('copa');
  S.queue.push('liga','balance','tienda','fichajes');
}
function nextStep(){
  if(S.alive&&!S.retired)saveGame();
  if(!S.alive)return render(screenDeath(S.deathMsg||'Tu historia terminó antes de tiempo.'));
  if(S.retired)return render(screenEnd());
  const step=S.queue.shift();
  if(!step)return advanceSeason();
  if(SLOTS.includes(step)){S.slot=step;S.mes=mesLabel(step);return showEvent(drawEvent(step));}
  if(step==='amor'){
    const esAmor=x=>/^amor_/.test(x.id)||x.id==='polola';
    const pool=eligible('invierno',false).filter(esAmor);
    if(!pool.length)return nextStep();     // si todo está en enfriamiento, ese año no pasa nada: mejor que repetir
    S.slot='invierno';S.mes=pick(['junio','julio','agosto']);S.ctx={};
    return showEvent(weighted(pool,'invierno'));
  }
  if(step==='copa')return render(screenCopa());
  if(step==='copachile'){        /* ¿llegaron a la final de Copa Chile? */
    const x=clamp((miFuerza()-52)/30,0,1.3),p=clamp(x*x*.3,.01,.3);   // la Copa Chile la juegan todas las divisiones: llegar a la final depende de la fuerza real
    if(ch(p)){S.mes='noviembre';return showEvent(EVENTS.find(e=>e.id==='copachile'));}
    return nextStep();
  }
  if(step==='liga'){S.mes='diciembre';return render(screenLiga(simulateSeason()));}
  if(step==='balance')return render(screenBalance());
  if(step==='liguilla')return render(screenLiguilla());
  if(step==='supercopa'){S.mes='enero';return render(screenSupercopa());}
  if(step==='seleccion')return render(screenSeleccion());
  if(step==='tienda')return render(screenTienda());
  if(step==='fichajes')return render(screenFichajes());
  return nextStep();
}
/* la edad manda: de cabro, carrete y webeo; de veterano, familia, plata y retiro */
function ageMult(e){
  const a=S.age,d=e.dom;
  if(d==='carrete')return a<=22?2.2:a<=26?1.3:a<=30?.6:.25;
  if(d==='familia')return a<=23?.35:a<=28?1.1:a<=31?2.8:4;
  if(d==='plata')return a<=21?.6:a<=28?1:a<=31?1.8:2.4;
  if(e.retiro)return a<=30?1:3.5;
  return 1;
}
function evWeight(e,slot){
  let w=typeof e.weight==='function'?e.weight(S):(e.weight==null?2:e.weight);
  w*=ageMult(e);
  const sn=S.seen&&S.seen[e.id];if(sn)w/=1+.8*sn.n;              // lo ya visto pesa menos
  if(e.mg&&e.dom==='minijuego')w*=slot==='temporada'?2.3:slot==='invierno'?1.6:slot==='fin'?1.2:1;
  return Math.max(0,w||0);
}
function eligible(slot,ignoreRecent){
  return EVENTS.filter(e=>{
    const sl=e.slots||['temporada','invierno','fin'];
    if(!sl.includes(slot))return false;
    if(e.once&&S.log.includes(e.id))return false;
    if(e.minAge&&S.age<e.minAge)return false;
    if(e.maxAge&&S.age>e.maxAge)return false;
    if(e.dom==='carrete'&&S.age<18)return false;                 // nada de copete antes de los 18
    if(!ignoreRecent&&S.recent.includes(e.id))return false;
    const sn=S.seen&&S.seen[e.id];
    if(!ignoreRecent&&sn&&S.year-sn.y<(e.cool||3))return false;  // cada evento se enfría unas temporadas
    if(e.cond&&!e.cond(S))return false;
    return evWeight(e,slot)>0;
  });
}
function weighted(list,slot){
  const t=list.reduce((a,e)=>a+evWeight(e,slot),0);let r=Math.random()*t;
  for(const e of list){r-=evWeight(e,slot);if(r<=0)return e;}
  return list[list.length-1];
}
function drawEvent(slot){
  for(let i=0;i<S.pending.length;i++){
    const p=S.pending[i];
    if(p.wait>0){p.wait--;continue;}
    if(ch(p.p)&&CONSEQ[p.id]){S.pending.splice(i,1);S.ctx=p.ctx||{};return CONSEQ[p.id];}
    p.ttl--; if(p.ttl<=0){S.pending.splice(i,1);i--;}
  }
  S.ctx={};
  /* hitos que no deberían perderse: el apodo y la celebración tienen prioridad cuando corresponden */
  const prio=eligible(slot,true).filter(x=>x.prio&&ch(x.prio));
  if(prio.length)return prio[0];
  let pool=eligible(slot,false);
  if(!pool.length)pool=eligible(slot,true);
  if(!pool.length)pool=EVENTS.filter(e=>e.id==='pichanga'||e.id==='once');
  return weighted(pool,slot);
}
function showEvent(ev){
  const w=V(ev.when);const m=typeof w==='string'&&MESES.find(x=>w.toLowerCase().startsWith(x));if(m)S.mes=m;
  if(ev.enter)ev.enter(S);
  S.log.push(ev.id);S.recent.push(ev.id);if(S.recent.length>16)S.recent.shift();
  if(S.seen){const sn=S.seen[ev.id]||{n:0};S.seen[ev.id]={y:S.year,n:sn.n+1};}
  render(ev.mg?screenMinigame(ev):screenEvent(ev));
}
const DOM_LABEL={cancha:'Cancha',camarin:'Camarín',carrete:'Carrete',cahuin:'Cahuín',barrio:'Barrio',plata:'Plata',
  roja:'Selección',minijuego:'Minijuego',peligro:'Ojo',amor:'Amor',familia:'Familia'};
function evHeader(ev){
  const when=V(ev.when)||`${cap(S.mes)} de ${S.year}`;
  return `<div class="ev-top"><span class="when">${esc(when)}</span><span class="dom">${DOM_LABEL[ev.dom]||'Cancha'}</span></div>
    <h2>${V(ev.title)}</h2><p class="txt">${V(ev.text)}</p>${ev.flavor?`<p class="flav">${V(ev.flavor)}</p>`:''}`;
}
function screenEvent(ev){
  const all=typeof ev.options==='function'?ev.options(S):ev.options;
  const opts=all.filter(o=>!o.show||o.show(S));
  const falta=o=>{const m=o.money?V(o.money):0;return m<0&&-m>S.plata+.0005?-m-S.plata:0;};   // solo las compras; las multas se pagan igual
  const todas=opts.every(o=>falta(o)>0);                       // por si acaso: nunca dejar el evento sin salida
  const c=screen(`<article class="ev d-${ev.dom||'cancha'}">${evHeader(ev)}
    <div class="opts">${opts.map((o,i)=>{const f=todas?0:falta(o);
      return `<button class="opt" data-i="${i}" ${f?'disabled':''}>${V(o.label)}${o.sub?`<span class="sub">${V(o.sub)}</span>`:''}${f?`<span class="sub nope">No te alcanza: te faltan ${pesos(f)}</span>`:''}${chipsFor(o)}</button>`;}).join('')}</div></article>`,true);
  const go=once(c);
  c.querySelectorAll('.opt:not([disabled])').forEach(b=>b.onclick=go(()=>resolveOption(ev,opts[+b.dataset.i])));
  return c;
}
function soften(b){['prestigio','hinchada'].forEach(k=>{if(S[k]<b[k])S[k]+=Math.round((b[k]-S[k])*.6);});}
/* el kine personal: 60% de zafar de cualquier lesión */
function kineSalva(b,out){if(S.items.kine&&S.lesionado>b.les&&ch(.6)){S.lesionado=b.les;out.t+=' Tu kine personal te dejó listo en una semana: zafaste de la lesión.';}}
function resolveOption(ev,o){
  if(o.mg)return render(screenMinigame(V(o.mg)));              // opciones que se juegan
  const b=snap();
  if(o.d)for(const k in o.d)S[k]=(S[k]||0)+o.d[k];
  const m=optMoney(o);if(m)addPlata(m);
  let out=o.fx?o.fx(S):null;
  if(out==null||out==='')out=o.res||'Listo.';
  if(typeof out==='string')out={t:out};
  if(out.death){S.alive=false;S.deathMsg=out.t;return render(screenDeath(out.t));}
  kineSalva(b,out);
  carretePicardia(b);
  if(ev.dom==='cahuin'&&S.items.cm)soften(b);
  clampAll();
  render(screenResult(out,b));
}
function quienSoy(){return S.apodo?cap(S.apodo):esc(S.name);}
function screenResult(out,b){
  let tab='';
  if(out.hl){
    S.seguidores+=Math.round((1500+S.seguidores*.05)*(S.items.cm?1.3:1));   // todo cahuín suma seguidores
    const baj=out.bad?`${quienSoy()}, otra vez en boca de todos.`:`Todo Chile habla de ${quienSoy()}.`;
    tab=`<div class="tab"><div class="mast"><b>EL CAHUÍN</b><span>${rnd(1,28)} de ${S.mes||'enero'} de ${S.year}</span></div><h2>${out.hl}</h2><p class="bajada">${baj}</p></div>`;

function holdHandlers(el,down,up){

  el.addEventListener('keydown',e=>{if((e.key===' '||e.key==='Enter')&&!e.repeat)down(e);});
  el.addEventListener('keyup',e=>{if(e.key===' '||e.key==='Enter')up(e);});
}

  const riesgo=i=>clamp(NOCHE[i].r*(1-(S.picardia-45)/150)*(S.items.chofer?.6:1),.01,.5);
  function show(){
    st.forEach((x,i)=>x.className=i<k?'done':i===k?'now':'');
    const e=NOCHE[k],g=Object.entries(e.g).map(([a,v])=>`+${v} ${attrLabel(a)}`).join(' · ');
    box.innerHTML=`<div class="stage"><b>${k+1}. ${e.n}</b><p>${e.t}</p><p class="small muted">Si vai: ${g} · riesgo ${Math.round(riesgo(k)*100)}%</p></div>
      <div class="opts"><button class="opt" id="nSeguir">${k===0?'Partir la noche':`Seguir: ${e.n.toLowerCase()}`}</button>
      <button class="opt" id="nIrse">${k===0?'Mejor me quedo en la casa':'Irme a la casa'}</button></div>`;
    box.querySelector('#nSeguir').onclick=()=>{if(busy)return;busy=true;
      const e2=NOCHE[k];for(const a in e2.g)acc[a]=(acc[a]||0)+e2.g[a];
      if(ch(riesgo(k))){k++;return fin(pick(PROBLEMAS_NOCHE));}
      k++;if(k>=NOCHE.length)return fin(null);busy=false;show();};
    box.querySelector('#nIrse').onclick=()=>{if(busy)return;busy=true;fin(null);};
  }
  function fin(problema){
    st.forEach((x,i)=>x.className=i<k?'done':'');
    for(const a in acc)S[a]=(S[a]||0)+acc[a];
    S.forma-=k*2;
    let out;
    if(problema){problema.fx();out={hl:pick(["¡Se les fue la mano!","¡Noche negra!","¡Carrete con final triste!"]),t:`Llegaron hasta ${NOCHE[k-1].n.toLowerCase()} y ahí se complicó todo. ${problema.t}`,bad:true};}
    else if(k>=NOCHE.length){hito("Cerró la noche completa: de la previa al completo de las 7");S.hinchada+=2;
      out={hl:"¡Noche legendaria!",t:"Previa, bar, disco, after y completo en la cuneta mientras salía el sol. Una noche que los cabros van a contar por años."};}
    else if(k===0){S.disciplina+=2;S.forma+=2;out={t:"Te quedaste en la casa. Los cabros te mandaron videos toda la noche; tú dormiste nueve horas."};}
    else out={t:`Te fuiste a la casa después de ${NOCHE[k-1].n.toLowerCase()}. Retirada a tiempo: carreteaste, pero mañana eres persona.`};
    carretePicardia(b);clampAll();
    tms.push(setTimeout(()=>render(screenResult(out,b)),300));
  }
  c.__mount=()=>onCleanup(()=>tms.forEach(clearTimeout));
  show();
  return c;
}

function leagueTeams(lid){
  const t=L(lid).teams;
  if(t.includes(S.club)||lid!==S.league)return t;
  return t.slice(0,-1).concat([S.club]);   // tu club subió o bajó: entra en la tabla
}
function simulateSeason(){
  const lg=L(S.league),teams=leagueTeams(S.league),rating=playerRating(),lesion=S.lesionado>0;
  S.maxPow=Math.max(S.maxPow,lg.pow);
  /* tu peso en el equipo depende de tu nivel contra el del plantel: un cabro de la banca no hunde a un grande */
  const myStr=clubStrength(S.club,S.league),rol=rating-myStr,inf=rol>=-4?clamp((rol+4)*.4,0,7):0;
  const rows=teams.map(t=>{const g3=tier(t)===3;let b=clubStrength(t,S.league)+rnd(g3?-7:-8,g3?7:8);if(t===S.club)b+=inf;return {name:t,b};});
  rows.sort((a,b)=>b.b-a.b);
  const n=rows.length,pj=(n-1)*2;
  rows.forEach(r=>r.pts=clamp(Math.round(20+(r.b-(lg.pow-20))*1.05),8,pj*3-6));
  for(let i=1;i<n;i++)if(rows[i].pts>rows[i-1].pts)rows[i].pts=rows[i-1].pts;
  const pos=rows.findIndex(r=>r.name===S.club)+1;

  let jug;                                                        // minutos según tu rol
  if(lesion)jug=rnd(6,15);
  else if(rol>=-3)jug=rnd(Math.round(pj*.78),pj);
  else if(rol>=-10)jug=rnd(Math.round(pj*.45),Math.round(pj*.8));
  else jug=rnd(Math.round(pj*.12),Math.round(pj*.4));
  /* goles por partido de un jugador "promedio" de la liga, según posición; se escala con qué tan bueno erís vs la liga */
  const m=clamp(1+(rating-lg.pow)/20,.3,2.1);
  const tp=S.items.chuteadores?1.3:1,ruido=()=>.8+Math.random()*.4;
  const RATE={delantero:[.44,.13],mediocampista:[.15,.21],defensa:[.05,.05],arquero:[0,0]}[S.pos]||[0,0];
  let g=Math.round(jug*RATE[0]*m*tp*ruido()),a=Math.round(jug*RATE[1]*m*ruido());
  const penales=S.pos!=='arquero'&&S.picardia>=58&&jug>=10?clamp(Math.round((S.picardia-50)/10)+rnd(-1,1),1,6):0;
  if(penales)g+=Math.floor(penales/2);
  g=Math.max(0,g);a=Math.max(0,a);
  S.goles+=g;S.asistencias+=a;S.partidos+=jug;S.temporadas++;
  if(S.lesionado>0)S.lesionado--;

  let campeon=false,asciende=false,desciende=false,goleador=false,liguilla=false;
  if(pos===1){campeon=true;S.titulos++;S.prestigio+=13;S.hinchada+=12;
    S.honours.push(`${lg.n} ${S.year}`);hito(`Campeón de ${lg.n} con ${S.club} (${S.year})`);}
  else if(pos<=3){S.prestigio+=6;S.hinchada+=5;}
  else if(pos<=n/2)S.prestigio+=2;
  else if(pos>n-3){S.prestigio-=7;S.hinchada-=6;}
  else S.prestigio-=2;
  S.prestigio+=Math.round((rating-lg.pow)/5);
  if(S.pos!=='arquero'&&(S.golIni!=null?S.goles-S.golIni:g)>=Math.round(pj*.6)){goleador=true;S.prestigio+=6;S.honours.push(`Goleador de ${lg.n} ${S.year}`);}
  if(S.pos==='arquero'&&pos<=2&&rating>=lg.pow){S.prestigio+=4;hito(`Arco menos batido de ${lg.n} (${S.year})`);}
  addPlata(S.salary);
  /* formato chileno: el campeón sube directo, la liguilla pelea el segundo cupo, los dos últimos bajan */
  if(lg.up&&pos===1)asciende=true;
  else if(lg.liguilla&&pos>=lg.liguilla[0]&&pos<=lg.liguilla[1])liguilla=true;
  if(lg.down&&pos>n-2)desciende=true;

  S.contComp=null;
  if(S.league==='CHI_1'){
    if(pos<=3)S.contComp={n:"Copa Libertadores",lvl:3,pre:16,cash:.5};
    else if(pos<=7)S.contComp={n:"Copa Sudamericana",lvl:2,pre:10,cash:.3};
    if(S.flags.ccWin===S.year&&(!S.contComp||S.contComp.lvl<3))S.contComp={n:"Copa Libertadores",lvl:3,pre:16,cash:.5};
    if(campeon||S.flags.ccWin===S.year){S.flags.supercopa=S.year+1;S.flags.scClub=S.club;
      S.flags.scRival=campeon?(S.flags.ccWin===S.year?rows[1].name:pick(teams.filter(t=>t!==S.club&&tier(t)>=2))):rows[0].name;}
  }
  if(S.mundialito){S.contComp={n:"Mundial de Clubes",lvl:4,pre:24,cash:.7};S.mundialito=false;}
  S.forma=clamp(S.forma+rnd(-8,8),10,95);
  clampAll();
  S.lastTable=rows.map((r,i)=>({name:r.name,pts:r.pts,pos:i+1,me:r.name===S.club,
    up:!!lg.up&&i===0,lq:!!lg.liguilla&&i+1>=lg.liguilla[0]&&i+1<=lg.liguilla[1],dn:!!lg.down&&i>=n-2,cp:S.league==='CHI_1'&&i<7}));
  /* el resumen del año suma también lo que metiste en eventos, minijuegos y copas */
  const gAnio=S.golIni!=null?Math.max(g,S.goles-S.golIni):g,aAnio=S.asiIni!=null?Math.max(a,S.asistencias-S.asiIni):a;
  g=gAnio;a=aAnio;
  S.history.push({y:S.year,club:S.club,lg:S.league,pos,g,a,jug});
  S.histMedia.push({y:S.year,m:Math.round(rating)});
  return {pos,total:n,pj,campeon,asciende,desciende,goleador,liguilla,g,a,jug,rating:Math.round(rating),penales,lesion};
}
function tablaRows(t,me){
  const keep=new Set();t.forEach(x=>{if(x.pos<=4||x.pos>t.length-2||Math.abs(x.pos-me)<=2)keep.add(x.pos);});
  let html='',last=0;
  t.forEach(x=>{if(!keep.has(x.pos))return;
    if(x.pos-last>1)html+=`<tr class="gap"><td colspan="3">···</td></tr>`;
    html+=`<tr class="${x.me?'me':''} ${x.up?'up':''} ${x.lq?'lq':''} ${x.dn?'dn':''} ${x.cp&&!x.up?'cp':''}"><td class="n">${x.pos}</td><td>${insignia(x.name,15)}${esc(x.name)}</td><td class="p">${x.pts}</td></tr>`;last=x.pos;});
  return html;
}

/* =================== BALANCE DEL AÑO: las stats cambian según cómo te fue =================== */
function seasonGrowth(){
  const r=S.prev||{jug:0,pj:30,g:0,a:0,pos:8,total:16,rating:Math.round(playerRating())};
  const lines=[],k=POSITIONS[S.pos].key,tech=['ritmo','resistencia','regate','pase','def'],lg=L(S.league),A=S.age+1;
  const avgTech=tech.reduce((x,a)=>x+S[a],0)/5,chileTecho=r.rating>72?clamp(1-(r.rating-72)/12,.22,1):1;   // el techo del fútbol chileno
  const pot=clamp((S.techo-avgTech)/12,.3,1.2)*chileTecho;   // techo de potencial oculto
  const add=(ico,txt,d,min1)=>{const eff={};
    for(const a in d){let v=d[a];if(tech.includes(a)&&v>0)v*=pot;v=Math.round(v);if(min1&&d[a]>0&&v<1)v=1;if(!v)continue;S[a]=(S[a]||0)+v;eff[a]=(eff[a]||0)+v;}
    if(Object.keys(eff).length)lines.push({ico,txt,d:eff});};
  /* el techo oculto se insinúa, pa' que se entienda por qué cuesta crecer */
  if(chileTecho<=.7&&A<=31)lines.push({ico:'🇨🇱',txt:'El fútbol chileno ya no te exige: cada punto de mejora cuesta el doble',d:{}});
  else if(pot<=.55&&A<=30)lines.push({ico:'🧱',txt:'Estái llegando a tu techo: cada punto de mejora cuesta el doble',d:{}});
  else if(pot>=1.15&&A<=21&&S.techo>=86)lines.push({ico:'🚀',txt:'Los scouts dicen que tenís potencial de sobra',d:{}});
  /* 1. el entrenamiento de todos los días, según edad y liga */
  if(A<=27){
    const t=A<=19?3.3:A<=22?2.9:A<=25?2.2:1.4,d={};
    tech.forEach(a=>d[a]=t*lg.dev*(.75+Math.random()*.55)*(S.items.gym?1.15:1));
    add('🏃',lg.dev>=1.15?`Entrenaste todo el año en la ${lg.n}, que exige al máximo`:lg.dev<.95?`Entrenaste en la ${lg.n}, una liga que no te exige mucho`:`Entrenaste todo el año en la ${lg.n}`,d);
  }
  /* 2. minutos */
  const share=r.pj?r.jug/r.pj:0;
  if(share>=.75)add('⏱️',`Jugaste ${r.jug} de ${r.pj} fechas: rodaje de titular`,{resistencia:2,[k[0]]:1});
  else if(share<.45)add('🪑',`Solo jugaste ${r.jug} de ${r.pj} fechas: te falta continuidad`,{ritmo:-1,forma:-5});
  /* 3. rendimiento */
  const exp={delantero:.35,mediocampista:.14,defensa:.04,arquero:0}[S.pos]*r.jug;
  if(S.pos!=='arquero'){
    if(r.g>=Math.max(3,exp*1.35))add('⚽',`${r.g} goles en el año: la confianza está por las nubes`,{def:2,forma:6});
    else if(S.pos==='delantero'&&r.jug>=10&&r.g<=exp*.5)add('😶',`Solo ${r.g} ${r.g===1?'gol':'goles'} en ${r.jug} partidos: la presión pesa`,{def:-1,forma:-6});
    if(r.a>=Math.max(4,r.jug*.2))add('🅰️',`${r.a} asistencias: estái viendo la cancha de otra manera`,{pase:2});
  }else if(r.pos<=3)add('🧤','Pocos goles en contra: estái en tu mejor momento bajo los palos',{def:2,forma:4});
  /* 4. el nivel de la liga contra el tuyo */
  const gap=lg.pow-r.rating;
  if(gap>=8&&A<=29)add('📈',`Jugar contra rivales de nivel ${lg.pow} te obligó a subir el tuyo`,{regate:1,pase:1,def:1});
  else if(gap<=-12&&S.league!=='CHI_1')add('😴',`La ${lg.n} te queda chica: estái jugando al trote`,{ritmo:-1,disciplina:-1});
  /* 5. cómo le fue al equipo */
  if(r.campeon)add('🏆','Campeón: ganar se vuelve costumbre',{liderazgo:2,forma:5});
  else if(r.pos<=3)add('🥉','Pelearon arriba todo el año',{liderazgo:1});
  else if(r.desciende)add('📉','El descenso te dejó marcado',{forma:-6,agresividad:1});
  if(S.flags.selYear===S.year)add('🎽',`Jugar por ${selName()} te dio otro roce`,{[k[0]]:1,liderazgo:1});
  /* 6. el carrete: menos forma, más picardía */
  if(S.carrete>=55)add('🪩','El carrete te pasó la cuenta, pero te hizo más pillo',{forma:-8,resistencia:-2,picardia:3});
  else if(S.carrete>=35)add('🍻','Carreteaste harto: menos piernas, más calle',{forma:-4,picardia:2});
  else if(S.carrete<=12)add('🧘','Año de monje: casa, entrenamiento y a dormir temprano',{disciplina:2,forma:3});
  /* 7. lesiones */
  if(r.lesion)add('🤕',S.items.kine?'La lesión te frenó, pero tu kine te recuperó rápido':'La lesión te dejó sin ritmo',S.items.kine?{ritmo:-1,forma:-2}:{ritmo:-2,forma:-4});
  /* 8. la gente que contrataste */
  if(S.items.gym)add('🏋️','Doble turno con el preparador físico',{[k[0]]:2,[k[1]]:2},1);
  if(S.items.nutri)add('🥗','La nutricionista te tiene como avión',{resistencia:2},1);
  if(S.items.psico)add('🧠','Las sesiones con el psicólogo deportivo',{disciplina:1,responsabilidad:1},1);
  if(S.items.chuteadores)add('👟','Los chuteadores top',{[k[0]]:1},1);
  if(S.items.kine)add('🩺','El kine personal te mantuvo entero',{resistencia:1},1);
  if(S.flags.capitan===S.club)add('🎖️','Llevar la jineta de capitán',{liderazgo:1,responsabilidad:1});
  /* 9. la edad */
  if(A>=29){const d=Math.max(1,Math.round((A-28)*.9));add('⏳',`Cumplís ${A} años: las piernas ya no son las mismas`,{ritmo:-d,resistencia:-d,regate:-Math.round(d*.6)});}
  if(A<=23)add('🧩','Maduraste un poco más',{[pick(['liderazgo','responsabilidad','disciplina'])]:rnd(1,2)});
  if(A>=30&&S.partidos>=250)add('🎓','La experiencia también juega',{liderazgo:1,responsabilidad:1});
  /* 10. la vida en la casa */
  const am=S.amor;
  if(am.pareja){
    amor(-2-Math.max(0,S.carrete-38)/4+(S.responsabilidad-50)/18-(am.junto?0:5));
    if(am.quimica>=65)add('💞',`${am.pareja.n} te tiene con los pies en la tierra`,{forma:4,disciplina:1});
    else if(am.quimica<35)add('💔',`Los problemas con ${am.pareja.n} se notan en la cancha`,{forma:-5});
  }
  if(am.hijos)add('👶',am.hijos===1?'Ser papá te ordenó la vida':`Con ${am.hijos} guaguas en la casa, el carrete quedó pa' otro día`,{carrete:-3,responsabilidad:1});
  /* 11. cómo cerraste el año */
  if(S.forma>=75)add('🔥','Cerraste el año en tu mejor momento',{[k[0]]:1});
  else if(S.forma<=25)add('🧊','Terminaste el año sin confianza',{[k[0]]:-1});
  clampAll();
  return lines;
}

const flagOf=n=>COUNTRIES[CONTI_CLUB[n]]?COUNTRIES[CONTI_CLUB[n]].f:'';
function miFuerza(){const r=playerRating(),my=clubStrength(S.club,S.league);return my+clamp((r-my+4)*.4,0,7);}
function marcador(gana){const a=rnd(0,2),b=rnd(0,2);if(gana===null)return `${a}-${a}`;return gana?`${Math.max(a,b)+1}-${Math.min(a,b)}`:`${Math.min(a,b)}-${Math.max(a,b)+1}`;}
function rivalCopa(lib,usados,fuerte,evitar){
  const paises=Object.keys(CONTI).filter(c=>!(evitar||[]).includes(c));let pool=[];
  paises.forEach(c=>{if(!lib&&c==='BR'&&ch(.6))return;CONTI[c].cl.forEach(n=>{if(!usados.includes(n))pool.push(n);});});
  if(fuerte)pool=pool.sort((a,b)=>contiStrength(b)-contiStrength(a)).slice(0,16);

}

  const comp=S.contComp;S.contComp=null;S.mes='noviembre';

    return screenFinal({comp:comp.n,rival:rv,rstr:93,pre:comp.pre,cash:comp.cash,
      txt:`Llegaste al Mundial de Clubes como campeón de América. Enfrente, ${rv}: una planilla que vale más que todo el fútbol chileno junto.`});}
  const lib=comp.n==='Copa Libertadores',mine=miFuerza()+(lib?0:3),usados=[],filas=[];
  const pWin=o=>clamp(.36+(mine-contiStrength(o))/45,.08,.78);
  const grupo=[];[0,1,2].forEach(()=>grupo.push(rivalCopa(lib,usados,false,grupo.map(n=>CONTI_CLUB[n]))));   // en el grupo, un rival por país
  let pts=0,gw=0,gd=0,gl=0;
  grupo.forEach(o=>{for(let k=0;k<2;k++){const p=pWin(o)+(k===0?.06:-.06),x=Math.random();if(x<p){pts+=3;gw++;}else if(x<p+.26){pts++;gd++;}else gl++;}});
  const pasa=pts>=10||(pts>=8&&ch(.55))||(pts===7&&ch(.2));
  filas.push({t:`Fase de grupos: ${pasa?'clasificaron':'quedaron fuera'} con ${pts} puntos (${gw} ganados, ${gd} empatados, ${gl} perdidos).`,rv:grupo,ok:pasa});
  const rondas=['Octavos de final','Cuartos de final','Semifinal'];let etapa=0;

    const prev=filas[filas.length-1].rv,o=rivalCopa(lib,usados,etapa>=1,[CONTI_CLUB[prev[prev.length-1]]]),ok=ch(clamp(.5+(mine-contiStrength(o))/50,.14,.85)),pen=ch(.22);
    filas.push({t:`${rondas[etapa]}: ${ok?'pasaron':'eliminados'} ${pen?`por penales, tras un ${marcador(null)} en el global`:`con un ${marcador(ok)} en el global`}.`,rv:[o],ok});
    if(!ok)break;}
  const finalista=pasa&&etapa===3,b=snap();
  S.prestigio+=Math.round(comp.pre*(.12+etapa*.1));addPlata(rel(comp.cash*(.2+etapa*.15)));
  if(pasa)S.hinchada+=3+etapa*2;
  if(ch(.35+etapa*.15))S.goles+=1;
  if(finalista)hito(`Llegó a la final de la ${comp.n} (${S.year})`);
  clampAll();
  const html=filas.map(f=>`<div class="copa-r ${f.ok?'ok':'ko'}"><div class="riv">${f.rv.map(n=>insignia(n,24)).join('')}</div>
    <div><p>${esc(f.t)}</p><span class="small muted">${f.rv.map(n=>`${esc(n)}&nbsp;${flagOf(n)}`).join(' · ')}</span></div></div>`).join('');
  const c=screen(`<article class="ev d-cancha"><div class="ev-top"><span class="when">${comp.n} ${S.year}</span><span class="dom">Copa</span></div>
    <h2>${finalista?'¡Están en la final!':`Tu camino en la ${comp.n}`}</h2><div class="copa">${html}</div>
    <p class="flav">${finalista?'Un equipo chileno en la final. Noventa minutos entre ser uno más o entrar a la historia grande.':pasa?'Llegaron más lejos que la mayoría de los equipos chilenos.':'La Copa es otra cosa. El próximo año será.'}</p>
    ${diffHTML(b)}</article><div class="stack"><button class="btn" id="btnCont">${finalista?'Jugar la final':'Seguir'}</button></div>`,true);
  c.querySelector('#btnCont').onclick=once(c)(()=>{
    if(!finalista)return nextStep();
    const ult=filas[filas.length-1].rv[0],rv=rivalCopa(lib,usados,true,[CONTI_CLUB[ult]]);
    render(screenFinal({comp:comp.n,rival:rv,rstr:contiStrength(rv),pre:comp.pre*(lib?1:.8),cash:comp.cash,
      txt:`La final de la ${comp.n}, a partido único, contra ${rv} ${flagOf(rv)}. Todo Chile va a estar mirando.`}));});
  return c;
}
/* una final se puede jugar de cuatro maneras, incluida la tanda de penales */
function screenFinal(f){

  const c=screen(`<article class="ev d-cancha"><div class="ev-top"><span class="when">${f.comp}, la final</span><span class="dom">Final</span></div>
    ${lead}<h2>${esc(S.club)} contra ${esc(f.rival)}</h2><p class="txt">${f.txt}</p><p class="flav">De estas hay una en la vida, si es que hay.</p>
    <div class="opts">
     <button class="opt" data-m="cara">Jugarla a cara de perro, sin especular${chipsFor({risk:"alto"})}</button>
     <button class="opt" data-m="orden">Jugar ordenado y esperar tu momento${chipsFor({risk:"medio"})}</button>
     <button class="opt" data-m="lider">Ponerte el equipo al hombro${chipsFor({d:{liderazgo:3},risk:"depende de tu liderazgo"})}</button>
     <button class="opt" data-m="penal">Aguantar el empate y patear el último penal${chipsFor({risk:"minijuego"})}</button>

  const perder=()=>{S.prestigio+=Math.round(f.pre*.4);addPlata(rel(f.cash*.5));S.forma-=8;
    if(f.comp!=='Supercopa de Chile')hito(`Subcampeón de la ${f.comp} (${S.year})`);
    return {t:`Perdieron la final contra ${esc(f.rival)}. Medalla de plata al cuello y una pena atravesada que no se va nunca.`,bad:true};};

      when:`${f.comp}, la final`,text:`Empataron y se fue a penales. Van 4 a 4 y te toca el último: si la metís, ${esc(S.club)} es campeón.`,
      flavor:'El arquero rival te está hablando. No lo mirí.',ins:'Toca cuando la pelota esté en la zona blanca',
      win:s=>ganar(),lose:s=>{const o=perder();o.t=`El arquero te la atajó. ${o.t}`;return o;}}));

  return c;

  if(S.year%4===0){if(conf==='CONMEBOL')return {n:"Copa América",pre:18};if(conf==='UEFA')return {n:"Eurocopa",pre:20};return {n:"Copa Asiática",pre:12};}
  return null;
}

/* =================== FICHAJES: solo clubes chilenos =================== */
function generateOffers(){
  const r=playerRating();
  const atr=r*.55+S.prestigio*.35+(S.items.rep?12:0)+(S.flags.boost?8:0)-(S.age>31?(S.age-31)*4:0)+(S.flags.quiere_salir?6:0);
  S.flags.boost=0;
  const cur=clubStrength(S.club,S.league),cands=[];
  LEAGUE_IDS.forEach(lid=>L(lid).teams.forEach(t=>{
    if(t===S.club||(S.flags.prestamo&&t===S.flags.prestamo.club))return;
    const str=clubStrength(t,lid),gap=str-cur;let p;
    if(gap<=-12)p=.025;else if(gap<=-3)p=.05;else if(gap<=6)p=clamp((atr-36)/260,.01,.1);
    else if(gap<=14)p=clamp((atr-46)/300,0,.09);else p=clamp((atr-56)/320,0,.07);
    if(tier(t)===3&&atr<58)p*=.15;
    if(ch(p))cands.push({lid,club:t,str});}));
  const riv=RIVAL[S.club];
  if(riv&&atr>=52&&ch(.16)){const x=pick(riv),lid=CLUB_LEAGUE[x.club];if(lid&&!cands.some(o=>o.club===x.club))cands.push({lid,club:x.club,str:clubStrength(x.club,lid)});}
  cands.sort((a,b)=>b.str-a.str);
  return cands.slice(0,S.items.rep?4:3).map(o=>({...o,sal:salaryFor(S,o.club,o.lid),rival:sonRivales(S.club,o.club)}));
}
function rolTxt(str){const d=playerRating()-str;return d>=-3?['Titular fijo','pos']:d>=-10?['A pelear el puesto','risk']:['Te va a costar jugar','neg'];}
function cambiarDeClub(club,lid,sal){
  const old=S.club,zonaAntes=zonaDe(old);
  if(!S.exClubs.includes(old))S.exClubs.push(old);
  S.league=lid;S.club=club;S.salary=sal;S.flags.quiere_salir=false;
  if(S.amor.pareja&&zonaDe(club)!==S.amor.zona&&zonaDe(club)!==zonaAntes)S.amor.junto=0;   // la pareja se queda: amor a distancia
  if(tier(club)===3)hito(`Fichó por ${club}`);
}

    ${html}${quedar}`,true);

      else{S.hinchada+=6;out={t:`Te quedaste en ${S.club}. La galería valoró la fidelidad y te cantó en el último partido.`};}}

/* =================== CAMBIO DE TEMPORADA =================== */
function advanceSeason(){
  const r=S.prev||{},lg=L(S.league);
  if(r.asciende&&lg.up){S.league=lg.up;hito(`Ascendió con ${S.club} a ${lname(S.league)}`);}
  else if(r.desciende&&lg.down){S.league=lg.down;}
  S.prev=null;
  S.season++;S.age++;S.year++;S.mes='enero';
  if(S.age>=31)S.prestigio-=2;
  S.carrete-=(S.age<24?3:6)+(S.flags.relacion==='piola'?3:0)-rnd(0,2);
  if(S.renta)addPlata(S.renta);
  /* los seguidores crecen con la fama, la hinchada y la picardía */
  S.seguidores+=Math.round((S.prestigio*S.prestigio*4+Math.pow(S.prestigio,3)/25+S.hinchada*60+S.picardia*25)*.5+S.seguidores*.04);   // fama a escala chilena
  if(S.seguidores>=1e6&&!S.flags.millon){S.flags.millon=1;hito("Llegó al millón de seguidores");}
  if(S.amor.cool)S.amor.cool=0;
  S.salary=salaryFor(S,S.club,S.league);
  clampAll();
  if(S.age>=38)return render(screenDespedida(true));
  if(S.age>=32)return render(screenRetire());
  startSeason();nextStep();
}

function legendFor(){for(const l of LEGENDS)if(l.cond(S))return l;return LEGENDS[LEGENDS.length-1];}
function pichuleroLevel(){
  const x=S.carreteMax*.6+S.prontuario.length*12;
  if(x<22)return {t:"Seminarista",d:"Ni una salida en toda la carrera. Tu mamá orgullosa; tus amigos, no tanto."};
  if(x<40)return {t:"Carretero de cumpleaños",d:"Salíai pa' los cumpleaños y a las 2 estabai en la cama."};
  if(x<60)return {t:"Fiestero de Bellavista",d:"Conocíai a todos los guardias de Bellavista por su nombre."};
  if(x<80)return {t:"Rey de la costa",d:"De Maitencillo a Reñaca, en todas las discos te tenían mesa."};
  return {t:"Pichulero mayor",d:"Te pillaron en más carretes de los que puede recordar la farándula. Leyenda de la noche chilena."};
}
function afterlife(){
  if(S.plata>=1500&&S.renta>0)return "Invertiste bien y hoy tenís una cadena de sushi con catorce locales en Santiago. Nunca más trabajaste un lunes.";
  if(S.flags.inferiores)return `Dirigís las inferiores de ${S.flags.inferiores}. Tres de tus cabros ya debutaron en primera y uno te dedicó su primer gol.`;
  if(S.flags.inaf===1&&S.liderazgo>=60)return "Con el título del INAF en la mano, hoy dirigís en la Primera B. Gritái más en la banca que lo que corriste en la cancha.";
  if(S.flags.escuelapropia)return "Tu escuela de fútbol ya tiene tres sedes y una lista de espera. Los sábados en la mañana son lo mejor de tu semana.";
  if(S.amor.estado==='casado'&&S.amor.hijos>=2)return "Te fuiste a una parcela con tu familia. Los domingos tus hijos te ganan en la pichanga y tú dices que te dejaste.";
  if(S.carreteMax>=75&&S.prontuario.length>=3)return "Entraste a un reality apenas te retiraste y saliste a los tres días por agarrarte con el animador. Ahora eres panelista de farándula.";
  if(S.flags.panelista)return "Te quedaste en la tele como panelista. Tus opiniones generan polémica todos los lunes y te encanta.";
  if(S.seguidores>=1e6)return "Con tus millones de seguidores armaste un streaming de fútbol que hoy tiene más audiencia que la tele abierta.";
  if(S.prestigio>=80&&S.liderazgo>=70)return "Terminaste de técnico de la selección. Duraste un año y medio, que pa' este país es harto.";
  if(S.hinchada>=85)return "Te hicieron una estatua afuera del estadio. Las palomas la visitan todos los días.";
  if(S.agresividad>=75)return "Te hiciste comentarista en un streaming y te echaron por garabatear en vivo. Ahora tenís tu propio canal.";
  if(S.goles>=150)return "Hoy comentái partidos en la tele y todas tus frases empiezan con «en mis tiempos».";
  if(S.responsabilidad>=70)return "Estudiaste una carrera en la noche y hoy eres gerente deportivo de un club.";
  if(S.flags.apv&&S.plata>=20)return "Gracias al ahorro que empezaste jugando, vivís tranquilo: viajái con tu familia y juegas la liga senior por gusto, no por plata.";
  if(S.plata<20)return "Se te fue la plata en autos y amigos. Hoy jugái la liga senior de los sábados y cobrái la cuota del asado.";
  return "Volviste a tu villa, pusiste una escuelita de fútbol y los domingos jugái la pichanga con los mismos de siempre.";
}
function scoreOf(){
  return Math.max(0,Math.round(S.goles*13+S.asistencias*7+S.partidos*1.4+S.titulos*230+S.prestigio*9+S.hinchada*4+
    S.achievements.length*80+S.honours.length*70+S.maxPow*3+(BIG_CLUBS.has(S.club)?150:0)+S.prontuario.length*15+
    Math.min(400,S.seguidores/5000)+S.amor.hijos*40));
}
function cells(){return `<div class="grid3">
  <div class="cell"><b>${S.goles}</b><span>goles</span></div><div class="cell"><b>${S.asistencias}</b><span>asistencias</span></div>

function prontuHTML(){return `<div class="prontu"><h3>Prontuario de carrete</h3>${S.prontuario.length?S.prontuario.map(p=>`<div class="li">${esc(p)}</div>`).join(''):'<div class="li">Limpio. Ni una multa. Tu mamá orgullosa.</div>'}</div>`;}
function amorHTML(){
  const a=S.amor,est={pololeando:'pololeando',conviviendo:'viviendo',comprometido:'comprometido',casado:'casado'};
  const hijos=a.hijos?` Tuvieron ${a.hijos===1?'una guagua':`${a.hijos} guaguas`}.`:'';
  let t;
  if(a.pareja)t=`Terminaste la carrera ${est[a.estado]||'con'} con ${esc(a.pareja.n)}, ${esc(a.pareja.of)}${a.estado==='casado'&&a.boda?`, desde ${a.boda}`:''}.${hijos}`;
  else if(a.hist.length)t=`Terminaste soltero después de ${a.hist.length} ${a.hist.length===1?'relación':'relaciones'} que la farándula siguió con lupa.${a.hijos?` Y ${a.hijos===1?'una guagua':`${a.hijos} guaguas`} que son tu orgullo.`:''}`;
  else t="Ni un pololeo conocido en toda la carrera. El fútbol fue tu único amor.";
  const list=a.hist.map(h=>`<div class="li">💞 ${esc(h.n)}, ${esc(h.of)} · ${h.desde}${h.hasta?`–${h.hasta}`:' – hoy'}${h.casados||(!h.hasta&&a.estado==='casado')?' · se casaron':''}</div>`).join('');
  return `<div class="card"><h3>Vida amorosa</h3><p>${t}</p>${list}</div>`;
}
function sparkHTML(){
  const h=S.histMedia;if(h.length<2)return '';
  const W=320,H=96,p=10,ms=h.map(x=>x.m),mn=Math.min(...ms)-3,mx=Math.max(...ms)+3;
  const X=i=>p+i*(W-2*p)/(h.length-1),Y=m=>H-p-(m-mn)*(H-2*p)/Math.max(1,mx-mn);
  const best=h.reduce((a,b)=>b.m>a.m?b:a),bi=h.indexOf(best);
  const pts=h.map((x,i)=>`${X(i).toFixed(1)},${Y(x.m).toFixed(1)}`).join(' ');
  return `<div class="card"><h3>Tu media, año a año</h3>
   <svg class="spark" viewBox="0 0 ${W} ${H}" role="img" aria-label="Media por temporada: partió en ${h[0].m}, llegó a ${best.m} en ${best.y} y terminó en ${h[h.length-1].m}">
    <polyline points="${pts}" fill="none" stroke="var(--red)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
    <circle cx="${X(bi).toFixed(1)}" cy="${Y(best.m).toFixed(1)}" r="5" fill="var(--gold)" stroke="var(--ink)" stroke-width="1.5"/></svg>
   <div class="legend"><span>${h[0].y}: ${h[0].m}</span><span>Peak: ${best.m} en ${best.y}</span><span>${h[h.length-1].y}: ${h[h.length-1].m}</span></div></div>`;
}

}
function screenSetup(){
  let pos=null,pref='mujeres';
  const c=screen(`<div class="head"><h2>¿Quién eres, crack?</h2><p class="muted small">Lo que no elijai queda al azar.</p></div>
   <div class="field"><label for="inpName">Nombre de camiseta</label><input class="inp" id="inpName" maxlength="24" placeholder="Como te van a gritar en la galería" autocomplete="off"></div>
   <div class="field"><label>Posición</label><div class="posg" id="posg">${Object.entries(POSITIONS).map(([k,v])=>`<button class="posb" data-pos="${k}" aria-pressed="false"><b>${v.label}</b><span>${v.sub}</span></button>`).join('')}</div></div>
   <div class="field"><label>Vida amorosa: te gustan</label><div class="posg g3" id="prefg">
     ${[['mujeres','Mujeres'],['hombres','Hombres'],['ambos','Ambos']].map(([k,t])=>`<button class="prefb" data-p="${k}" aria-pressed="${k===pref}"><b>${t}</b></button>`).join('')}</div>
     <p class="muted small" style="margin-top:6px">El amor aparece recién a los 18.</p></div>
   <div class="field"><label for="selLeague">División donde partís</label><select class="sel" id="selLeague"><option value="">🎲 Al azar</option>${['CHI_2','CHI_B','CHI_1'].map(k=>`<option value="${k}">${L(k).n}</option>`).join('')}</select></div>
   <div class="field"><label for="selClub">Club</label><select class="sel" id="selClub"><option value="">🎲 Al azar</option></select>
     <p class="muted small" style="margin-top:6px">En un grande pagan más, pero te va a costar tener minutos.</p></div>
   <div class="stack"><button class="btn" id="btnConfirm">Salir a la cancha</button><button class="btn ghost" id="btnBack">Volver</button></div>`,false);
  const g=c.querySelector('#posg');
  g.querySelectorAll('.posb').forEach(b=>b.onclick=()=>{
    g.querySelectorAll('.posb').forEach(x=>x.setAttribute('aria-pressed','false'));
    if(pos===b.dataset.pos){pos=null;return;}
    b.setAttribute('aria-pressed','true');pos=b.dataset.pos;});
  const pg=c.querySelector('#prefg');
  pg.querySelectorAll('.prefb').forEach(b=>b.onclick=()=>{
    pg.querySelectorAll('.prefb').forEach(x=>x.setAttribute('aria-pressed','false'));
    b.setAttribute('aria-pressed','true');pref=b.dataset.p;});
  const sl=c.querySelector('#selLeague'),sc=c.querySelector('#selClub');
  sl.onchange=()=>{const id=sl.value;
    sc.innerHTML='<option value="">🎲 Al azar</option>'+(id?L(id).teams.map(t=>`<option value="${esc(t)}">${esc(t)}</option>`).join(''):'');};
  c.querySelector('#btnConfirm').onclick=()=>{
    S=newState({name:c.querySelector('#inpName').value,pos,pref,league:sl.value||null,club:sc.value||null});
    clearGame();render(screenSorteo());};
  c.querySelector('#btnBack').onclick=()=>render(screenTitle());
  return c;
}
function screenSorteo(){
  const big=BIG_CLUBS.has(S.club),lg=L(S.league);
  const msg=big?"La suerte te sonrió como la chucha: debutái nada menos que en un grande. Pagan bien, pero los minutos se pelean con uñas y dientes."
    :S.league==='CHI_1'?"Partís en la Liga de Primera. Si rendís, los grandes te van a venir a buscar."
    :S.league==='CHI_B'?"Primera B: canchas duras, viajes largos y la liguilla como sueño. De acá salieron varios cracks."
    :"Segunda División: canchas donde se sufre de verdad y sueldos de esfuerzo. Como los grandes.";
  const c=screen(`<div class="hero" style="padding-top:14px">
     <div style="display:flex;justify-content:center;margin-bottom:12px">${insignia(S.club,84)}</div>
     <h2 style="font-size:40px">${esc(S.club)}</h2>
     <p class="muted" style="margin-top:4px">${lg.n} de ${cname(S.league)}${ciudad(S.club)&&isChile(S.league)?`, ${ciudad(S.club)}`:''}</p>
     <p class="pitch" style="margin-top:14px">${msg}</p></div>
   <div class="card"><h3>Tu primer contrato</h3>
     <p>${esc(S.name)}. ${POSITIONS[S.pos].label}, ${COUNTRIES[S.nat].f} ${COUNTRIES[S.nat].n}, 16 años.</p>
     <p class="muted small" style="margin-top:4px">Sueldo: ${pesos(S.salary)} por temporada. En el bolsillo: ${pesos(S.plata)}.</p></div>
   <div class="stack"><button class="btn" id="btnGo">Empezar la temporada ${S.year}</button></div>`,false);
  c.querySelector('#btnGo').onclick=once(c)(()=>{startSeason();nextStep();});
  return c;
}

render(screenTitle());

</script>
</body>
</html>
